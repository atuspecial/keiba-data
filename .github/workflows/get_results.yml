name: Get Results

on:
  schedule:
    # 土日 18:30 JST (= UTC 09:30) に1回実行（全レース終了後）
    - cron: '30 9 * * 6,0'
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYYMMDD)。空欄で今日'
        required: false
        default: ''

jobs:
  get-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run get_results
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -n "$DATE_ARG" ]; then
            python src/scraper/get_results.py --date "$DATE_ARG"
          else
            python src/scraper/get_results.py
          fi

      - name: Commit and push results CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ls data/results/results_*.csv 1>/dev/null 2>&1; then
            git add data/results/results_*.csv
          fi

          if git diff --cached --quiet; then
            echo "新しい結果データなし。スキップ。"
          else
            TIMESTAMP=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "chore: レース結果取得 ${TIMESTAMP}"
            git push
          fi
