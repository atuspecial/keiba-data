name: Get Odds

on:
  schedule:
    # 土日 09:00〜17:50 JST (= UTC 00:00〜08:50) に10分間隔
    # JST = UTC+9 なので UTC 0:00 = JST 9:00
    - cron: '0,10,20,30,40,50 0-8 * * 6,0'
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYYMMDD)。空欄で今日'
        required: false
        default: ''

jobs:
  get-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml rich PyYAML

      - name: Run get_odds (auto mode)
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -n "$DATE_ARG" ]; then
            python src/scraper/get_odds.py --auto --date "$DATE_ARG"
          else
            python src/scraper/get_odds.py --auto
          fi

      - name: Commit and push CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 新しいCSVがあれば追加（存在しない場合はスキップ）
          if ls data/raw/odds_*.csv 1>/dev/null 2>&1; then
            git add data/raw/odds_*.csv
          fi

          # 差分がある場合のみコミット
          if git diff --cached --quiet; then
            echo "新しいデータなし（開催なし or オッズ未確定）。スキップ。"
          else
            TIMESTAMP=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "chore: オッズ取得 ${TIMESTAMP}"
            git push
          fi
